name: Profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      # Classic PAT. Needs `repo` scope for private commits to be counted;
      # without it the stats card only sees public activity.
      PAT_1: ${{ secrets.PAT_1 }}
    steps:
      - name: Render streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=MeshalAlamr&theme=tokyonight&hide_border=true&border_radius=8
          path: out/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render stats card
        if: env.PAT_1 != ''
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: username=MeshalAlamr&show_icons=true&card_width=495&include_all_commits=true&hide_border=true&hide_title=true&border_radius=8&theme=tokyonight
          path: out/stats.svg
          token: ${{ secrets.PAT_1 }}
          fail_on_error: "true"

      - name: Reject error cards
        run: |
          set -euo pipefail
          if [ -z "${PAT_1}" ]; then
            echo "::warning::PAT_1 secret not set - skipping the stats card. Streak card only."
          fi
          shopt -s nullglob
          for f in out/*.svg; do
            size=$(wc -c < "$f")
            echo "$f -> ${size} bytes"
            if [ "$size" -lt 2500 ]; then
              echo "::error::$f looks like an error card (${size} bytes); refusing to publish"
              exit 1
            fi
            if grep -qiE 'Something went wrong|Failed to retrieve|Maximum retries' "$f"; then
              echo "::error::$f contains an error message; refusing to publish"
              exit 1
            fi
          done

      - name: Publish to assets branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet --branch assets --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub
          cp out/*.svg pub/
          cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No change in rendered cards; nothing to commit."
          else
            git commit -qm "chore: refresh profile cards"
            git push --quiet
            echo "Published updated cards."
          fi
